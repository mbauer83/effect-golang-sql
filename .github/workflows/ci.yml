name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # effect-golang is not published yet, so go.mod resolves it from a
      # sibling working copy. CI reproduces that layout rather than carrying a
      # second replace directive that would drift from the local one.
      - uses: actions/checkout@v5
        with:
          path: effect-golang-sql
      - uses: actions/checkout@v5
        with:
          repository: mbauer83/effect-golang
          path: effect-golang
      - uses: actions/checkout@v5
        with:
          repository: mbauer83/effect-golang-schema
          path: effect-golang-schema

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Formatting
        working-directory: effect-golang-sql
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: effect-golang-sql
        run: go build ./...

      - name: Vet
        working-directory: effect-golang-sql
        run: go vet ./...

      # -count=1 defeats the test result cache, so a green run always reflects
      # the commit it ran on. -coverpkg is needed because the suites live
      # outside the packages they exercise.
      - name: Test
        working-directory: effect-golang-sql
        run: go test -count=1 -coverpkg=./... ./...

      - name: Race
        working-directory: effect-golang-sql
        run: go test -race -count=1 ./...

      - name: Examples
        working-directory: effect-golang-sql
        run: go run ./examples/cmd/sqldemo

  # The generated schema and the migrations, against the two databases they were
  # written for. The derivation they share with SQLite is established in the
  # ordinary suite; what only these can answer is whether the statements are
  # statements they accept.
  #
  # A job of its own, so a service container that will not start blocks this and
  # not the suite that needs nothing.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: effect
          POSTGRES_DB: effect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: effect
          MYSQL_DATABASE: effect
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -peffect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: effect-golang-sql
      - uses: actions/checkout@v5
        with:
          repository: mbauer83/effect-golang
          path: effect-golang
      - uses: actions/checkout@v5
        with:
          repository: mbauer83/effect-golang-schema
          path: effect-golang-schema

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      # -run selects them by name, so the job says what it established rather
      # than running the whole suite again with two variables set.
      - name: The generated schema and migrations, against Postgres and MySQL
        working-directory: effect-golang-sql
        env:
          EFFECT_GOLANG_POSTGRES_URL: postgres://postgres:effect@127.0.0.1:5432/effect?sslmode=disable
          EFFECT_GOLANG_MYSQL_URL: root:effect@tcp(127.0.0.1:3306)/effect?parseTime=true
        run: go test -count=1 -v -run 'SchemaIsOne|MigrationIsOne' ./test/acceptance/
