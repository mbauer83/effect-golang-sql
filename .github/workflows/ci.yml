name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # One checkout. go.mod requires the modules below this one by version, so
      # this job resolves them the way anyone depending on this module does --
      # which is the point of running it: a green run says the published
      # dependencies are enough to build and test this commit.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test result cache, so a green run always reflects
      # the commit it ran on. -coverpkg is needed because the suites live
      # outside the packages they exercise.
      - name: Test
        run: go test -count=1 -coverpkg=./... ./...

      - name: Race
        run: go test -race -count=1 ./...

      # Every Gen body rewritten into a FlatMap chain must behave exactly as
      # written, so the suites run again on the rewritten source.
      - name: Race, rewritten
        run: go tool effectgo test -race -count=1 ./...

      - name: Examples
        run: go run ./examples/cmd/sqldemo

  # The generated schema and the migrations, against the two databases they were
  # written for. The derivation they share with SQLite is established in the
  # ordinary suite; what only these can answer is whether the statements are
  # statements they accept.
  #
  # A job of its own, so a service container that will not start blocks this and
  # not the suite that needs nothing.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: effect
          POSTGRES_DB: effect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: effect
          MYSQL_DATABASE: effect
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -peffect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      # -run selects them by name, so the job says what it established rather
      # than running the whole suite again with two variables set.
      - name: The generated schema, migrations and statement shapes, against Postgres and MySQL
        env:
          EFFECT_GOLANG_POSTGRES_URL: postgres://postgres:effect@127.0.0.1:5432/effect?sslmode=disable
          EFFECT_GOLANG_MYSQL_URL: root:effect@tcp(127.0.0.1:3306)/effect?parseTime=true
        run: go test -count=1 -v -run 'SchemaIsOne|MigrationIsOne|StatementShapesRunOn|WholeQuerySpecificationRunsOn|LockIsTaken' ./test/acceptance/
